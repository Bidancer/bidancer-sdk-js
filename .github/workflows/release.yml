name: Release

# Pending changesets → "Version Packages" PR. Merging that PR publishes to npm.
# Needs the NPM_TOKEN repository secret (npm automation token).
#
# Opening that PR needs a token allowed to create pull requests. The Bidancer
# org policy forbids GITHUB_TOKEN from doing so ("GitHub Actions is not
# permitted to create or approve pull requests"), so either an org admin
# enables it (org Settings → Actions → General → Workflow permissions, then the
# same toggle on this repo), or add a CHANGESETS_TOKEN repository secret: a
# fine-grained PAT scoped to this repo with Contents + Pull requests
# read/write. When present it is used instead of GITHUB_TOKEN.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun test
      - uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
